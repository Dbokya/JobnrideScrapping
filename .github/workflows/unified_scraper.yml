name: JobNRide Unified Job Scraper

on:
  schedule:
    # Runs 4x daily (every 6 hours)
    # 00:00, 06:00, 12:00, 18:00 UTC = 5:30, 11:30, 17:30, 23:30 IST
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:  # allow manual trigger from GitHub Actions UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: unified_scraper

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: unified_scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Firebase service account key
        run: |
          mkdir -p serviceaccount
          echo '${{ secrets.FIREBASE_KEY }}' > serviceaccount/jobnride-97d77-firebase-adminsdk-fbsvc-20ce6e6129.json

      - name: Clean up bad jobs (non-English / no description)
        run: python cleanup.py

      - name: Scrape and save new jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          THEMUSE_API_KEY: ${{ secrets.THEMUSE_API_KEY }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
        run: python main.py
